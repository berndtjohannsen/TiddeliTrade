# Same as docker-compose.portainer-web.yml — for Git stack path or Web editor paste.
# GitHub Actions builds and pushes to ghcr.io (see .github/workflows/container.yml).
# Portainer pulls the image; do not build on the server.

services:
  tiddelitrade:
    image: ghcr.io/berndtjohannsen/tiddelitrade:${TIDDELI_TAG:-latest}
    pull_policy: always
    container_name: tiddelitrade
    ports:
      - "3002:3000"
    environment:
      PORT: "3000"
      TIDDELI_DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - tiddelitrade-data:/app/data
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  tiddelitrade-data:
