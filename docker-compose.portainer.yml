# Portainer stack — deploy from Git (Pull and redeploy).
#
# Portainer → Stacks → Add stack → Git repository:
#   URL:    https://github.com/berndtjohannsen/TiddeliTrade.git
#   Ref:    main
#   Path:   docker-compose.portainer.yml
#
# IMPORTANT — no `build:` here. Portainer 2.29+ often returns HTTP 500 when a Git
# stack tries to build on the server. Build the image on the host first, then redeploy:
#
#   cd /path/to/TiddeliTrade && git pull
#   docker build -t tiddelitrade:latest .
#   Portainer → Stacks → tiddelitrade → Pull and redeploy
#
# For an editable stack in Portainer, use docker-compose.portainer-web.yml instead.
#
# App URL: http://<server-host>:3002
# First run: open Settings in the UI and enter IG credentials (stored in the volume).

services:
  tiddelitrade:
    image: tiddelitrade:latest
    container_name: tiddelitrade
    ports:
      - "3002:3000"
    environment:
      PORT: "3000"
      TIDDELI_DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - tiddelitrade-data:/app/data
    # Cap RAM so a Node/SQLite spike OOMs this container instead of the whole host (32 GB box).
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  tiddelitrade-data:
