# Same stack as docker-compose.portainer.yml — kept as an alternate compose path only.
# Prefer docker-compose.portainer.yml for new Git stacks.
#
# See docker-compose.portainer.yml for setup (Git repository, not Web editor paste-only).

services:
  tiddelitrade:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiddelitrade:latest
    pull_policy: build
    container_name: tiddelitrade
    ports:
      - "3002:3000"
    environment:
      PORT: "3000"
      TIDDELI_DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - tiddelitrade-data:/app/data
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  tiddelitrade-data:
