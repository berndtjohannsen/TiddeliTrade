# Portainer stack: pull the image GitHub builds. Do not build on the server.
# Paste this in Portainer (Stacks → Add stack → Web editor). Set env vars in the UI if needed.
# Same pattern as TiddeliQuiz — GitHub Actions publishes to ghcr.io; Portainer pulls on Update.
#
# After pushing code: wait for GitHub Actions to finish, then Update the stack (Re-pull OK).

services:
  tiddelitrade:
    image: ghcr.io/berndtjohannsen/tiddelitrade:${TIDDELI_TAG:-latest}
    pull_policy: always
    container_name: tiddelitrade
    ports:
      - "3002:3000"
    environment:
      PORT: "3000"
      TIDDELI_DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - tiddelitrade-data:/app/data
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  tiddelitrade-data:
