# Portainer — Web editor stack (editable in the UI).
#
# Setup (one time):
#   1. Portainer → Stacks → Add stack → Web editor → name: tiddelitrade
#   2. Paste this file → Deploy the stack
#
# Do NOT use "Git repository" for this stack — Git stacks hide the Editor even without build:.
#
# Rebuild image after pulling code on the server:
#   cd /path/to/TiddeliTrade && git pull && docker build -t tiddelitrade:latest .
#   Portainer → Stacks → tiddelitrade → Update the stack
#
# App URL: http://<server-host>:3002

services:
  tiddelitrade:
    image: tiddelitrade:latest
    container_name: tiddelitrade
    ports:
      - "3002:3000"
    environment:
      PORT: "3000"
      TIDDELI_DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - tiddelitrade-data:/app/data
    # Cap RAM so a Node/SQLite spike OOMs this container instead of the whole host.
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  tiddelitrade-data:
